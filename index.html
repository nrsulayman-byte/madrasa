<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14503F">
<title>মাদরাসা ব্যবস্থাপনা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<style>
:root {
  --bg: #f3f6f4;
  --surface: #ffffff;
  --ink: #17231d;
  --muted: #5d6d64;
  --line: #d8e1db;
  --brand: #14503f;
  --brand-ink: #ffffff;
  --brand-soft: #e2efe8;
  --gold: #a9782a;
  --present: #1f7a4d;
  --present-soft: #dcf1e5;
  --absent: #b3372f;
  --absent-soft: #f8e1df;
  --leave: #8a6412;
  --leave-soft: #f6ebcf;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1613;
    --surface: #17211c;
    --ink: #e8f0eb;
    --muted: #9db0a5;
    --line: #2a3a32;
    --brand: #3f9c7a;
    --brand-ink: #08140f;
    --brand-soft: #1d3329;
    --gold: #d6a651;
    --present: #5fd09a;
    --present-soft: #1a3a2b;
    --absent: #ef8a83;
    --absent-soft: #3d2220;
    --leave: #e3bf6a;
    --leave-soft: #3a2f16;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1613;
  --surface: #17211c;
  --ink: #e8f0eb;
  --muted: #9db0a5;
  --line: #2a3a32;
  --brand: #3f9c7a;
  --brand-ink: #08140f;
  --brand-soft: #1d3329;
  --gold: #d6a651;
  --present: #5fd09a;
  --present-soft: #1a3a2b;
  --absent: #ef8a83;
  --absent-soft: #3d2220;
  --leave: #e3bf6a;
  --leave-soft: #3a2f16;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Hind Siliguri", "Noto Sans Bengali", "Kalpurush", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  padding-top: env(safe-area-inset-top, 0px);
  -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.3; }

.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px;
  background: var(--brand); color: var(--brand-ink);
}
.topbar h1 { font-size: 19px; font-weight: 700; }
.topbar .who { font-size: 13px; opacity: .85; }
.topbar button {
  background: transparent; border: 1px solid currentColor; color: inherit;
  border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px;
}

main { padding: 16px 16px 96px; max-width: 640px; margin: 0 auto; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav button {
  flex: 1; border: 0; background: none; padding: 12px 4px; cursor: pointer;
  font-size: 15px; font-weight: 500; color: var(--muted);
  border-top: 3px solid transparent;
}
.nav button[aria-current="true"] { color: var(--brand); border-top-color: var(--brand); font-weight: 700; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.panel h2 { font-size: 17px; margin-bottom: 12px; }

label { display: block; font-size: 14px; font-weight: 500; margin: 12px 0 4px; color: var(--muted); }
input, select {
  width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); min-height: 44px;
}
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

.btn {
  display: inline-block; border: 0; border-radius: 10px; cursor: pointer;
  background: var(--brand); color: var(--brand-ink);
  padding: 12px 18px; font-weight: 600; min-height: 46px;
}
.btn.block { width: 100%; margin-top: 16px; }
.btn.ghost { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; }

.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 12px 0; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.item-name { font-weight: 600; }
.meta { font-size: 14px; color: var(--muted); }
.tag {
  display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px;
  background: var(--brand-soft); color: var(--brand); font-weight: 600;
}
.tag.off { background: var(--absent-soft); color: var(--absent); }

.marks { display: flex; gap: 6px; margin-top: 8px; }
.marks button {
  flex: 1; padding: 9px 4px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); cursor: pointer; font-size: 14px; font-weight: 500; min-height: 42px;
}
.marks button[data-s="present"][aria-pressed="true"] { background: var(--present-soft); border-color: var(--present); color: var(--present); font-weight: 700; }
.marks button[data-s="absent"][aria-pressed="true"] { background: var(--absent-soft); border-color: var(--absent); color: var(--absent); font-weight: 700; }
.marks button[data-s="leave"][aria-pressed="true"] { background: var(--leave-soft); border-color: var(--leave); color: var(--leave); font-weight: 700; }

.summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; font-size: 14px; }
.summary span { padding: 3px 10px; border-radius: 99px; font-weight: 600; }
.summary .p { background: var(--present-soft); color: var(--present); }
.summary .a { background: var(--absent-soft); color: var(--absent); }
.summary .l { background: var(--leave-soft); color: var(--leave); }
.summary .u { background: var(--brand-soft); color: var(--muted); }

.empty { text-align: center; color: var(--muted); padding: 24px 8px; }
.note { font-size: 14px; color: var(--muted); }

.auth { max-width: 400px; margin: 0 auto; padding: 48px 20px; }
.auth h1 { font-size: 26px; color: var(--brand); margin-bottom: 4px; }
.auth p { margin: 0 0 20px; color: var(--muted); }

.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  max-width: 420px; margin: 0 auto; z-index: 20;
  background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 10px; font-size: 15px;
}
.toast.err { background: var(--absent); color: #fff; }
.toast[hidden] { display: none; }

details.panel summary { cursor: pointer; font-weight: 600; font-size: 17px; }
details.panel[open] summary { margin-bottom: 4px; }

@media (prefers-reduced-motion: no-preference) {
  .btn, .marks button { transition: background .15s, border-color .15s; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
const SUPABASE_URL = "https://rfkckvghaxfpbkpbewvl.supabase.co";
const SUPABASE_KEY = "sb_publishable_l963B-BHA5mtqV-YwVBAvQ_Agf0Y5jq";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ROLE_BN = { admin: "অ্যাডমিন", teacher: "শিক্ষক", accountant: "হিসাবরক্ষক" };
const STATUS_BN = { present: "উপস্থিত", absent: "অনুপস্থিত", leave: "ছুটি" };

const state = {
  session: null,
  profile: null,
  classes: [],
  students: [],
  tab: "attendance",
  att: { classId: "", date: todayStr(), rows: [], marks: {} },
  stu: { classId: "", q: "" }
};

const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const bn = (n) => Number(n).toLocaleString("bn-BD");
const isAdmin = () => state.profile && state.profile.role === "admin";

function todayStr() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}

let toastTimer;
function toast(msg, isErr) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast" + (isErr ? " err" : "");
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}

function niceError(e) {
  const m = (e && e.message) || "";
  if (/Invalid login credentials/i.test(m)) return "ইমেইল বা পাসওয়ার্ড ভুল।";
  if (/duplicate key/i.test(m)) return "এই তথ্য আগে থেকেই আছে।";
  if (/row-level security/i.test(m)) return "এই কাজের অনুমতি আপনার নেই।";
  if (/Failed to fetch|NetworkError/i.test(m)) return "ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না।";
  return m || "কিছু একটা ভুল হয়েছে।";
}

/* ---------- Start ---------- */
async function init() {
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  sb.auth.onAuthStateChange((_evt, session) => {
    const changed = (session && session.user.id) !== (state.session && state.session.user.id);
    state.session = session;
    if (changed) start();
  });
  start();
}

async function start() {
  if (!state.session) { state.profile = null; return renderAuth(); }
  $("#app").innerHTML = '<p class="empty">লোড হচ্ছে…</p>';
  const { data, error } = await sb.from("profiles").select("role, full_name").eq("id", state.session.user.id).single();
  if (error) { toast(niceError(error), true); }
  state.profile = data || { role: "teacher", full_name: "" };
  await loadBase();
  renderShell();
}

async function loadBase() {
  const [c, s] = await Promise.all([
    sb.from("classes").select("id, name").order("name"),
    sb.from("students").select("id, name, father_name, class_id, roll_no, guardian_phone, status, residence").order("roll_no", { ascending: true, nullsFirst: false }).order("name")
  ]);
  if (c.error) toast(niceError(c.error), true);
  if (s.error) toast(niceError(s.error), true);
  state.classes = c.data || [];
  state.students = s.data || [];
}

/* ---------- Login ---------- */
function renderAuth() {
  $("#app").innerHTML = `
    <div class="auth">
      <h1>মাদরাসা ব্যবস্থাপনা</h1>
      <p>চালিয়ে যেতে লগইন করুন।</p>
      <label for="em">ইমেইল</label>
      <input id="em" type="email" autocomplete="username" inputmode="email">
      <label for="pw">পাসওয়ার্ড</label>
      <input id="pw" type="password" autocomplete="current-password">
      <button class="btn block" id="loginBtn">লগইন করুন</button>
      <p class="note" style="margin-top:16px">নতুন শিক্ষক বা হিসাবরক্ষকের অ্যাকাউন্ট অ্যাডমিন খুলে দেবেন।</p>
    </div>`;
  const go = async () => {
    const email = $("#em").value.trim();
    const password = $("#pw").value;
    if (!email || !password) return toast("ইমেইল ও পাসওয়ার্ড দিন।", true);
    const btn = $("#loginBtn");
    btn.disabled = true; btn.textContent = "লগইন হচ্ছে…";
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      btn.disabled = false; btn.textContent = "লগইন করুন";
      toast(niceError(error), true);
    }
  };
  $("#loginBtn").onclick = go;
  $("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
}

/* ---------- Shell ---------- */
function renderShell() {
  const p = state.profile;
  $("#app").innerHTML = `
    <header class="topbar">
      <div>
        <h1>মাদরাসা ব্যবস্থাপনা</h1>
        <div class="who">${esc(p.full_name || state.session.user.email)} (${esc(ROLE_BN[p.role] || p.role)})</div>
      </div>
      <button id="logout">লগআউট</button>
    </header>
    <main id="main"></main>
    <nav class="nav">
      <button data-tab="attendance">হাজিরা</button>
      <button data-tab="students">শিক্ষার্থী</button>
      <button data-tab="classes">ক্লাস</button>
    </nav>`;
  $("#logout").onclick = () => sb.auth.signOut();
  document.querySelectorAll(".nav button").forEach((b) => {
    b.onclick = () => { state.tab = b.dataset.tab; showTab(); };
  });
  showTab();
}

function showTab() {
  document.querySelectorAll(".nav button").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === state.tab ? "true" : "false"));
  if (state.tab === "attendance") return viewAttendance();
  if (state.tab === "students") return viewStudents();
  return viewClasses();
}

const classOptions = (selected, placeholder) =>
  `<option value="">${esc(placeholder)}</option>` +
  state.classes.map((c) => `<option value="${c.id}" ${String(c.id) === String(selected) ? "selected" : ""}>${esc(c.name)}</option>`).join("");

/* ---------- Attendance ---------- */
async function loadAttendance() {
  const a = state.att;
  if (!a.classId) { a.rows = []; a.marks = {}; return; }
  a.rows = state.students.filter((s) => String(s.class_id) === String(a.classId) && s.status === "active");
  a.marks = {};
  const ids = a.rows.map((s) => s.id);
  if (ids.length) {
    const { data, error } = await sb.from("attendance").select("student_id, status").eq("date", a.date).in("student_id", ids);
    if (error) toast(niceError(error), true);
    (data || []).forEach((r) => { a.marks[r.student_id] = r.status; });
  }
}

function attRowsHtml() {
  const a = state.att;
  if (!a.classId) return '<p class="empty">হাজিরা নিতে একটি ক্লাস বেছে নিন।</p>';
  if (!a.rows.length) return '<p class="empty">এই ক্লাসে কোনো সক্রিয় শিক্ষার্থী নেই। আগে "শিক্ষার্থী" ট্যাবে যোগ করুন।</p>';
  const count = { present: 0, absent: 0, leave: 0 };
  a.rows.forEach((s) => { if (a.marks[s.id]) count[a.marks[s.id]]++; });
  const un = a.rows.length - count.present - count.absent - count.leave;
  const items = a.rows.map((s) => `
    <li data-id="${s.id}">
      <div class="item-top">
        <span class="item-name">${s.roll_no ? bn(s.roll_no) + ". " : ""}${esc(s.name)}</span>
      </div>
      <div class="marks">
        ${["present", "absent", "leave"].map((k) => `<button data-s="${k}" aria-pressed="${a.marks[s.id] === k}">${STATUS_BN[k]}</button>`).join("")}
      </div>
    </li>`).join("");
  return `
    <div class="summary">
      <span class="p">উপস্থিত ${bn(count.present)}</span>
      <span class="a">অনুপস্থিত ${bn(count.absent)}</span>
      <span class="l">ছুটি ${bn(count.leave)}</span>
      <span class="u">বাকি ${bn(un)}</span>
    </div>
    <div class="row" style="margin-bottom:8px">
      <button class="btn ghost small" id="allPresent">সবাইকে উপস্থিত করুন</button>
    </div>
    <ul class="list">${items}</ul>
    <button class="btn block" id="saveAtt">হাজিরা সংরক্ষণ করুন</button>`;
}

async function viewAttendance() {
  $("#main").innerHTML = `
    <div class="panel">
      <h2>দৈনিক হাজিরা</h2>
      <div class="row">
        <div><label for="aCls">ক্লাস</label><select id="aCls">${classOptions(state.att.classId, "ক্লাস বেছে নিন")}</select></div>
        <div><label for="aDate">তারিখ</label><input id="aDate" type="date" value="${state.att.date}"></div>
      </div>
    </div>
    <div class="panel" id="attBody"><p class="empty">লোড হচ্ছে…</p></div>`;
  $("#aCls").onchange = async (e) => { state.att.classId = e.target.value; await refreshAtt(); };
  $("#aDate").onchange = async (e) => { state.att.date = e.target.value || todayStr(); await refreshAtt(); };
  await refreshAtt();
}

async function refreshAtt() {
  await loadAttendance();
  paintAtt();
}

function paintAtt() {
  const body = $("#attBody");
  if (!body) return;
  body.innerHTML = attRowsHtml();
  body.querySelectorAll("li[data-id] .marks button").forEach((b) => {
    b.onclick = () => {
      const id = b.closest("li").dataset.id;
      state.att.marks[id] = b.dataset.s;
      paintAtt();
    };
  });
  const all = $("#allPresent");
  if (all) all.onclick = () => { state.att.rows.forEach((s) => { state.att.marks[s.id] = "present"; }); paintAtt(); };
  const save = $("#saveAtt");
  if (save) save.onclick = saveAttendance;
}

async function saveAttendance() {
  const a = state.att;
  const payload = a.rows.filter((s) => a.marks[s.id]).map((s) => ({ student_id: s.id, date: a.date, status: a.marks[s.id] }));
  if (!payload.length) return toast("কারো হাজিরা বেছে নেওয়া হয়নি।", true);
  const btn = $("#saveAtt");
  btn.disabled = true; btn.textContent = "সংরক্ষণ হচ্ছে…";
  const { error } = await sb.from("attendance").upsert(payload, { onConflict: "student_id,date" });
  btn.disabled = false; btn.textContent = "হাজিরা সংরক্ষণ করুন";
  if (error) return toast(niceError(error), true);
  toast(`${bn(payload.length)} জনের হাজিরা সংরক্ষিত হয়েছে।`);
}

/* ---------- Students ---------- */
function studentListHtml() {
  const { classId, q } = state.stu;
  const term = q.trim().toLowerCase();
  const list = state.students.filter((s) =>
    (!classId || String(s.class_id) === String(classId)) &&
    (!term || (s.name || "").toLowerCase().includes(term) || (s.father_name || "").toLowerCase().includes(term))
  );
  if (!list.length) return '<p class="empty">কোনো শিক্ষার্থী পাওয়া যায়নি।</p>';
  const cname = (id) => (state.classes.find((c) => c.id === id) || {}).name || "ক্লাস নেই";
  return `<p class="note">মোট ${bn(list.length)} জন</p><ul class="list">` + list.map((s) => `
    <li>
      <div class="item-top">
        <span class="item-name">${s.roll_no ? bn(s.roll_no) + ". " : ""}${esc(s.name)}</span>
        <span class="tag ${s.status === "active" ? "" : "off"}">${s.status === "active" ? "সক্রিয়" : "বন্ধ"}</span>
      </div>
      <div class="meta">${esc(cname(s.class_id))}${s.father_name ? " · পিতা: " + esc(s.father_name) : ""}${s.residence === "resident" ? " · আবাসিক" : ""}</div>
      ${s.guardian_phone ? `<div class="meta">অভিভাবক: <a href="tel:${esc(s.guardian_phone)}">${esc(s.guardian_phone)}</a></div>` : ""}
      ${isAdmin() ? `<div style="margin-top:8px"><button class="btn ghost small" data-toggle="${s.id}" data-to="${s.status === "active" ? "inactive" : "active"}">${s.status === "active" ? "বন্ধ করুন" : "সক্রিয় করুন"}</button></div>` : ""}
    </li>`).join("") + "</ul>";
}

function viewStudents() {
  const addForm = isAdmin() ? `
    <details class="panel">
      <summary>নতুন শিক্ষার্থী যোগ করুন</summary>
      <label for="sName">নাম *</label><input id="sName">
      <label for="sFather">পিতার নাম</label><input id="sFather">
      <div class="row">
        <div><label for="sClass">ক্লাস *</label><select id="sClass">${classOptions("", "বেছে নিন")}</select></div>
        <div><label for="sRoll">রোল নম্বর</label><input id="sRoll" type="number" min="1" inputmode="numeric"></div>
      </div>
      <label for="sPhone">অভিভাবকের ফোন</label><input id="sPhone" type="tel" inputmode="tel">
      <label for="sRes">থাকার ধরন</label>
      <select id="sRes"><option value="non_resident">অনাবাসিক</option><option value="resident">আবাসিক</option></select>
      <button class="btn block" id="addStu">শিক্ষার্থী যোগ করুন</button>
    </details>` : "";
  $("#main").innerHTML = `
    ${addForm}
    <div class="panel">
      <h2>শিক্ষার্থীর তালিকা</h2>
      <div class="row">
        <div><label for="fCls">ক্লাস</label><select id="fCls">${classOptions(state.stu.classId, "সব ক্লাস")}</select></div>
        <div><label for="fQ">খুঁজুন</label><input id="fQ" type="search" placeholder="নাম লিখুন" value="${esc(state.stu.q)}"></div>
      </div>
      <div id="stuList" style="margin-top:8px"></div>
    </div>`;
  const paint = () => {
    $("#stuList").innerHTML = studentListHtml();
    document.querySelectorAll("[data-toggle]").forEach((b) => {
      b.onclick = async () => {
        const { error } = await sb.from("students").update({ status: b.dataset.to }).eq("id", b.dataset.toggle);
        if (error) return toast(niceError(error), true);
        await loadBase(); paint();
      };
    });
  };
  $("#fCls").onchange = (e) => { state.stu.classId = e.target.value; paint(); };
  $("#fQ").oninput = (e) => { state.stu.q = e.target.value; paint(); };
  paint();
  const add = $("#addStu");
  if (add) add.onclick = async () => {
    const name = $("#sName").value.trim();
    const classId = $("#sClass").value;
    if (!name) return toast("শিক্ষার্থীর নাম লিখুন।", true);
    if (!classId) return toast("একটি ক্লাস বেছে নিন।", true);
    const roll = parseInt($("#sRoll").value, 10);
    add.disabled = true;
    const { error } = await sb.from("students").insert({
      name,
      father_name: $("#sFather").value.trim() || null,
      class_id: Number(classId),
      roll_no: Number.isFinite(roll) ? roll : null,
      guardian_phone: $("#sPhone").value.trim() || null,
      residence: $("#sRes").value
    });
    add.disabled = false;
    if (error) return toast(niceError(error), true);
    toast(`${name} যোগ করা হয়েছে।`);
    await loadBase();
    viewStudents();
  };
}

/* ---------- Classes ---------- */
function viewClasses() {
  const count = (id) => state.students.filter((s) => s.class_id === id && s.status === "active").length;
  const addForm = isAdmin() ? `
    <div class="panel">
      <h2>নতুন ক্লাস</h2>
      <label for="cName">ক্লাসের নাম</label>
      <input id="cName" placeholder="যেমন: হিফজ, নাযেরা, মিজান">
      <button class="btn block" id="addCls">ক্লাস যোগ করুন</button>
    </div>` : "";
  $("#main").innerHTML = `
    ${addForm}
    <div class="panel">
      <h2>সব ক্লাস</h2>
      ${state.classes.length
        ? `<ul class="list">${state.classes.map((c) => `
            <li><div class="item-top"><span class="item-name">${esc(c.name)}</span><span class="meta">${bn(count(c.id))} জন শিক্ষার্থী</span></div></li>`).join("")}</ul>`
        : '<p class="empty">এখনো কোনো ক্লাস নেই।' + (isAdmin() ? " উপরে প্রথম ক্লাসটি যোগ করুন।" : "") + "</p>"}
    </div>`;
  const add = $("#addCls");
  if (add) add.onclick = async () => {
    const name = $("#cName").value.trim();
    if (!name) return toast("ক্লাসের নাম লিখুন।", true);
    add.disabled = true;
    const { error } = await sb.from("classes").insert({ name });
    add.disabled = false;
    if (error) return toast(niceError(error), true);
    toast(`"${name}" ক্লাস যোগ করা হয়েছে।`);
    await loadBase();
    viewClasses();
  };
}

init();
</script>
</body>
</html>
